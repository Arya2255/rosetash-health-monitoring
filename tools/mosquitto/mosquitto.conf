# Mosquitto test broker — local gateway testing (Roztash gateway project).
# Anonymous access, LAN listener, no persistence. For TEST ONLY on a trusted
# network — the factory broker (HSE system) will have its own config.
#
# Port 1884 on purpose: the system mosquitto service (installed via apt)
# already owns 127.0.0.1:1883, and this test instance runs as a normal user
# process, so it must not collide with it.
listener 1884 0.0.0.0
allow_anonymous true
persistence false
