<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" style="background: #1a1a2e;">
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" font-family="Arial">
    نقشه اتصالات ESP32 + W5500 + DHT22 + منبع تغذیه
  </text>
  
  <!-- Power Supply Box -->
  <rect x="50" y="450" width="180" height="100" fill="#3d3d5c" stroke="#ff6b6b" stroke-width="3" rx="10"/>
  <text x="140" y="480" text-anchor="middle" fill="#ff6b6b" font-size="16" font-weight="bold">
    منبع تغذیه 5V/2A
  </text>
  <text x="140" y="505" text-anchor="middle" fill="#ffffff" font-size="12">
    ⚠️ هنگام USB قطع باشد
  </text>
  
  <!-- Power Supply Pins -->
  <circle cx="50" cy="480" r="8" fill="#ff6b6b"/>
  <text x="30" y="485" text-anchor="end" fill="#ffffff" font-size="11">5V (مثبت)</text>
  
  <circle cx="50" cy="520" r="8" fill="#333333"/>
  <text x="30" y="525" text-anchor="end" fill="#ffffff" font-size="11">GND (منفی)</text>
  
  <!-- ESP32 Board -->
  <rect x="350" y="120" width="200" height="400" fill="#3d3d5c" stroke="#4da6ff" stroke-width="3" rx="10"/>
  <text x="450" y="145" text-anchor="middle" fill="#4da6ff" font-size="18" font-weight="bold">
    ESP32 (38-pin)
  </text>
  <text x="450" y="165" text-anchor="middle" fill="#888888" font-size="10">
    ZY-ESP32 DevKit
  </text>
  
  <!-- ESP32 Left Side Pins -->
  <text x="340" y="200" text-anchor="end" fill="#ff6b6b" font-size="11">3.3V</text>
  <circle cx="350" cy="195" r="6" fill="#ff6b6b"/>
  
  <text x="340" y="230" text-anchor="end" fill="#333333" font-size="11">GND</text>
  <circle cx="350" cy="225" r="6" fill="#333333"/>
  
  <text x="340" y="260" text-anchor="end" fill="#4da6ff" font-size="11">GPIO21</text>
  <circle cx="350" cy="255" r="6" fill="#4ecdc4"/>
  
  <text x="340" y="290" text-anchor="end" fill="#4da6ff" font-size="11">GPIO19</text>
  <circle cx="350" cy="285" r="6" fill="#95e1d3"/>
  
  <text x="340" y="320" text-anchor="end" fill="#4da6ff" font-size="11">GPIO18</text>
  <circle cx="350" cy="315" r="6" fill="#f38181"/>
  
  <text x="340" y="350" text-anchor="end" fill="#4da6ff" font-size="11">GPIO5</text>
  <circle cx="350" cy="345" r="6" fill="#aa96da"/>
  
  <text x="340" y="380" text-anchor="end" fill="#4da6ff" font-size="11">GPIO23</text>
  <circle cx="350" cy="375" r="6" fill="#fcbad3"/>
  
  <text x="340" y="410" text-anchor="end" fill="#4da6ff" font-size="11">GPIO32</text>
  <circle cx="350" cy="405" r="6" fill="#48dbfb"/>
  
  <!-- ESP32 Right Side Pins -->
  <text x="560" y="230" fill="#333333" font-size="11">GND</text>
  <circle cx="550" cy="225" r="6" fill="#333333"/>
  
  <text x="560" y="260" fill="#4da6ff" font-size="11">GPIO4</text>
  <circle cx="550" cy="255" r="6" fill="#feca57"/>
  
  <text x="560" y="290" fill="#ff6b6b" font-size="11">5V</text>
  <circle cx="550" cy="285" r="6" fill="#ff6b6b"/>
  
  <!-- W5500 Module -->
  <rect x="620" y="120" width="160" height="300" fill="#3d3d5c" stroke="#ff9f43" stroke-width="3" rx="10"/>
  <text x="700" y="145" text-anchor="middle" fill="#ff9f43" font-size="16" font-weight="bold">
    W5500 Ethernet
  </text>
  <text x="700" y="165" text-anchor="middle" fill="#888888" font-size="10">
    HanRun HR911105A
  </text>
  
  <!-- W5500 Pins -->
  <text x="630" y="200" fill="#ffffff" font-size="11">VCC</text>
  <circle cx="620" cy="195" r="6" fill="#ff6b6b"/>
  
  <text x="630" y="230" fill="#ffffff" font-size="11">GND</text>
  <circle cx="620" cy="225" r="6" fill="#333333"/>
  
  <text x="630" y="260" fill="#ffffff" font-size="11">INT</text>
  <circle cx="620" cy="255" r="6" fill="#4ecdc4"/>
  
  <text x="630" y="290" fill="#ffffff" font-size="11">MISO</text>
  <circle cx="620" cy="285" r="6" fill="#95e1d3"/>
  
  <text x="630" y="320" fill="#ffffff" font-size="11">SCK</text>
  <circle cx="620" cy="315" r="6" fill="#f38181"/>
  
  <text x="630" y="350" fill="#ffffff" font-size="11">CS</text>
  <circle cx="620" cy="345" r="6" fill="#aa96da"/>
  
  <text x="630" y="380" fill="#ffffff" font-size="11">MOSI</text>
  <circle cx="620" cy="375" r="6" fill="#fcbad3"/>
  
  <text x="630" y="410" fill="#ffffff" font-size="11">RST</text>
  <circle cx="620" cy="405" r="6" fill="#feca57"/>
  
  <!-- DHT22 Sensor -->
  <rect x="620" y="450" width="160" height="130" fill="#3d3d5c" stroke="#10ac84" stroke-width="3" rx="10"/>
  <text x="700" y="475" text-anchor="middle" fill="#10ac84" font-size="16" font-weight="bold">
    DHT22
  </text>
  <text x="700" y="495" text-anchor="middle" fill="#888888" font-size="10">
    ASAIR AM2302
  </text>
  
  <!-- DHT22 Pins -->
  <text x="630" y="525" fill="#ffffff" font-size="11">VCC</text>
  <circle cx="620" cy="520" r="6" fill="#ff6b6b"/>
  
  <text x="630" y="555" fill="#ffffff" font-size="11">GND</text>
  <circle cx="620" cy="550" r="6" fill="#333333"/>
  
  <text x="630" y="560" fill="#ffffff" font-size="11">DATA</text>
  <circle cx="620" cy="555" r="6" fill="#48dbfb"/>
  
  <!-- Power Rails (Common VCC and GND) -->
  <!-- VCC 3.3V Rail -->
  <line x1="350" y1="195" x2="280" y2="195" stroke="#ff6b6b" stroke-width="3"/>
  <line x1="280" y1="195" x2="280" y2="100" stroke="#ff6b6b" stroke-width="3"/>
  <line x1="280" y1="100" x2="620" y2="100" stroke="#ff6b6b" stroke-width="3"/>
  <line x1="620" y1="100" x2="620" y2="195" stroke="#ff6b6b" stroke-width="3"/>
  
  <!-- Also to DHT22 VCC -->
  <line x1="280" y1="100" x2="280" y2="520" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="280" y1="520" x2="620" y2="520" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- GND Rail -->
  <line x1="350" y1="225" x2="300" y2="225" stroke="#333333" stroke-width="3"/>
  <line x1="300" y1="225" x2="300" y2="75" stroke="#333333" stroke-width="3"/>
  <line x1="300" y1="75" x2="700" y2="75" stroke="#333333" stroke-width="3"/>
  <line x1="700" y1="75" x2="700" y2="550" stroke="#333333" stroke-width="3"/>
  
  <!-- Power Supply Connection -->
  <line x1="50" y1="480" x2="550" y2="285" stroke="#ff6b6b" stroke-width="3"/>
  <line x1="50" y1="520" x2="550" y2="225" stroke="#333333" stroke-width="3"/>
  
  <!-- SPI Connections -->
  <!-- SCK -->
  <line x1="350" y1="315" x2="620" y2="315" stroke="#f38181" stroke-width="2"/>
  
  <!-- MISO -->
  <line x1="350" y1="285" x2="620" y2="285" stroke="#95e1d3" stroke-width="2"/>
  
  <!-- MOSI -->
  <line x1="350" y1="375" x2="610" y2="375" stroke="#fcbad3" stroke-width="2"/>
  <line x1="610" y1="380" x2="620" y2="380" stroke="#fcbad3" stroke-width="2"/>
  
  <!-- CS -->
  <line x1="350" y1="345" x2="620" y2="345" stroke="#aa96da" stroke-width="2"/>
  
  <!-- RST -->
  <line x1="550" y1="255" x2="620" y2="405" stroke="#feca57" stroke-width="2"/>
  
  <!-- INT -->
  <line x1="350" y1="255" x2="620" y2="255" stroke="#4ecdc4" stroke-width="2"/>
  
  <!-- DHT22 DATA -->
  <line x1="350" y1="405" x2="620" y2="405" stroke="#48dbfb" stroke-width="2"/>
  <text x="485" y="398" fill="#48dbfb" font-size="9">GPIO32</text>
  
  <!-- Pull-up Resistor Symbol for DHT22 -->
  <text x="300" y="515" fill="#10ac84" font-size="10">10kΩ</text>
  <text x="300" y="530" fill="#10ac84" font-size="8">pull-up</text>
  
  <!-- Legend -->
  <rect x="20" y="600" width="860" height="80" fill="#2d2d44" stroke="#4a9eff" stroke-width="2" rx="5"/>
  <text x="450" y="625" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">
    راهنمای رنگ‌ها
  </text>
  
  <!-- Color Legend Items -->
  <circle cx="80" cy="650" r="6" fill="#ff6b6b"/>
  <text x="95" y="655" fill="#ffffff" font-size="11">VCC</text>
  
  <circle cx="180" cy="650" r="6" fill="#333333"/>
  <text x="195" y="655" fill="#ffffff" font-size="11">GND</text>
  
  <circle cx="280" cy="650" r="6" fill="#f38181"/>
  <text x="295" y="655" fill="#ffffff" font-size="11">SCK</text>
  
  <circle cx="380" cy="650" r="6" fill="#95e1d3"/>
  <text x="395" y="655" fill="#ffffff" font-size="11">MISO</text>
  
  <circle cx="480" cy="650" r="6" fill="#fcbad3"/>
  <text x="495" y="655" fill="#ffffff" font-size="11">MOSI</text>
  
  <circle cx="580" cy="650" r="6" fill="#aa96da"/>
  <text x="595" y="655" fill="#ffffff" font-size="11">CS</text>
  
  <circle cx="680" cy="650" r="6" fill="#feca57"/>
  <text x="695" y="655" fill="#ffffff" font-size="11">RST</text>
  
  <circle cx="780" cy="650" r="6" fill="#48dbfb"/>
  <text x="795" y="655" fill="#ffffff" font-size="11">DATA</text>
  
  <!-- Warning Box -->
  <rect x="50" y="570" width="180" height="25" fill="#ff6b6b" fill-opacity="0.2" stroke="#ff6b6b" stroke-width="2" rx="5"/>
  <text x="140" y="587" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="bold">
    ⚠️ USB و منبع همزمان ممنوع
  </text>
  
</svg>