<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg" style="background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif;">
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">
    نقشه اتصالات ESP32 + W5500 + DHT22 + منبع تغذیه
  </text>
  
  <text x="500" y="65" text-anchor="middle" fill="#888888" font-size="12">
    منابع: GitHub esp32-w5500-driver | Adafruit Learning System | Espressif Docs
  </text>
  
  <!-- Power Supply Box -->
  <rect x="50" y="520" width="200" height="120" fill="#3d3d5c" stroke="#ff6b6b" stroke-width="3" rx="10"/>
  <text x="150" y="550" text-anchor="middle" fill="#ff6b6b" font-size="16" font-weight="bold">
    منبع تغذیه 5V/2A
  </text>
  <text x="150" y="575" text-anchor="middle" fill="#ffffff" font-size="11">
    ⚠️ هنگام USB قطع باشد
  </text>
  <text x="150" y="600" text-anchor="middle" fill="#888888" font-size="9">
    منبع: Espressif ESP32-DevKitC V4
  </text>
  
  <!-- Power Supply Pins -->
  <circle cx="50" cy="560" r="8" fill="#ff6b6b"/>
  <text x="30" y="565" text-anchor="end" fill="#ffffff" font-size="11">5V+</text>
  
  <circle cx="50" cy="600" r="8" fill="#333333"/>
  <text x="30" y="605" text-anchor="end" fill="#ffffff" font-size="11">GND-</text>
  
  <!-- ESP32 Board -->
  <rect x="350" y="150" width="250" height="450" fill="#3d3d5c" stroke="#4da6ff" stroke-width="3" rx="10"/>
  <text x="475" y="175" text-anchor="middle" fill="#4da6ff" font-size="18" font-weight="bold">
    ESP32 (ESP32-S NodeMCU)
  </text>
  <text x="475" y="195" text-anchor="middle" fill="#888888" font-size="10">
    ZY-ESP32, CP2102, Type-C
  </text>
  
  <!-- ESP32 Left Side Pins -->
  <circle cx="350" cy="220" r="6" fill="#ff6b6b"/>
  <text x="340" y="225" text-anchor="end" fill="#ffffff" font-size="10">3.3V</text>
  
  <circle cx="350" cy="250" r="6" fill="#333333"/>
  <text x="340" y="255" text-anchor="end" fill="#ffffff" font-size="10">GND</text>
  
  <circle cx="350" cy="280" r="6" fill="#feca57"/>
  <text x="340" y="285" text-anchor="end" fill="#ffffff" font-size="10">GPIO22</text>
  
  <circle cx="350" cy="310" r="6" fill="#4ecdc4"/>
  <text x="340" y="315" text-anchor="end" fill="#ffffff" font-size="10">GPIO21</text>
  
  <circle cx="350" cy="340" r="6" fill="#95e1d3"/>
  <text x="340" y="345" text-anchor="end" fill="#ffffff" font-size="10">GPIO19</text>
  
  <circle cx="350" cy="370" r="6" fill="#f38181"/>
  <text x="340" y="375" text-anchor="end" fill="#ffffff" font-size="10">GPIO18</text>
  
  <circle cx="350" cy="430" r="6" fill="#48dbfb"/>
  <text x="340" y="435" text-anchor="end" fill="#ffffff" font-size="10">GPIO32</text>
  
  <!-- ESP32 Right Side Pins -->
  <circle cx="600" cy="220" r="6" fill="#333333"/>
  <text x="610" y="225" fill="#ffffff" font-size="10">GND</text>
  
  <circle cx="600" cy="280" r="6" fill="#fcbad3"/>
  <text x="610" y="285" fill="#ffffff" font-size="10">GPIO23</text>
  
  <circle cx="600" cy="340" r="6" fill="#aa96da"/>
  <text x="610" y="345" fill="#ffffff" font-size="10">GPIO4</text>
  
  <circle cx="600" cy="400" r="6" fill="#ff6b6b"/>
  <text x="610" y="405" fill="#ffffff" font-size="10">5V</text>
  
  <!-- W5500 Module -->
  <rect x="700" y="150" width="180" height="350" fill="#3d3d5c" stroke="#ff9f43" stroke-width="3" rx="10"/>
  <text x="790" y="175" text-anchor="middle" fill="#ff9f43" font-size="16" font-weight="bold">
    W5500 Ethernet
  </text>
  <text x="790" y="195" text-anchor="middle" fill="#888888" font-size="10">
    HanRun HR911105A
  </text>
  <text x="790" y="210" text-anchor="middle" fill="#888888" font-size="8">
    منبع: GitHub esp32-w5500-driver
  </text>
  
  <!-- W5500 Pins -->
  <circle cx="700" cy="230" r="6" fill="#ff6b6b"/>
  <text x="720" y="235" fill="#ffffff" font-size="10">VCC</text>
  
  <circle cx="700" cy="270" r="6" fill="#333333"/>
  <text x="720" y="275" fill="#ffffff" font-size="10">GND</text>
  
  <circle cx="700" cy="310" r="6" fill="#fcbad3"/>
  <text x="720" y="315" fill="#ffffff" font-size="10">MOSI</text>
  
  <circle cx="700" cy="350" r="6" fill="#feca57"/>
  <text x="720" y="355" fill="#ffffff" font-size="10">RESET</text>
  
  <circle cx="700" cy="390" r="6" fill="#4ecdc4"/>
  <text x="720" y="395" fill="#ffffff" font-size="10">CS</text>
  
  <circle cx="700" cy="430" r="6" fill="#95e1d3"/>
  <text x="720" y="435" fill="#ffffff" font-size="10">MISO</text>
  
  <circle cx="700" cy="470" r="6" fill="#f38181"/>
  <text x="720" y="475" fill="#ffffff" font-size="10">SCLK</text>
  
  <!-- DHT22 Sensor -->
  <rect x="700" y="520" width="180" height="150" fill="#3d3d5c" stroke="#10ac84" stroke-width="3" rx="10"/>
  <text x="790" y="545" text-anchor="middle" fill="#10ac84" font-size="16" font-weight="bold">
    DHT22 (AM2302)
  </text>
  <text x="790" y="565" text-anchor="middle" fill="#888888" font-size="10">
    سنسور دما و رطوبت
  </text>
  <text x="790" y="580" text-anchor="middle" fill="#888888" font-size="8">
    منبع: Adafruit Learning System
  </text>
  
  <!-- DHT22 Pins -->
  <circle cx="700" cy="600" r="6" fill="#ff6b6b"/>
  <text x="720" y="605" fill="#ffffff" font-size="10">VCC</text>
  
  <circle cx="700" cy="630" r="6" fill="#48dbfb"/>
  <text x="720" y="635" fill="#ffffff" font-size="10">DATA</text>
  
  <circle cx="700" cy="650" r="6" fill="#888888"/>
  <text x="720" y="655" fill="#ffffff" font-size="10">NC</text>
  
  <circle cx="700" cy="650" r="6" fill="#333333"/>
  <text x="720" y="655" fill="#ffffff" font-size="10">GND</text>
  
  <!-- Pull-up Resistor Symbol -->
  <rect x="800" y="610" width="30" height="40" fill="none" stroke="#10ac84" stroke-width="2"/>
  <text x="815" y="635" text-anchor="middle" fill="#10ac84" font-size="9">10kΩ</text>
  <line x1="790" y1="600" x2="800" y2="610" stroke="#10ac84" stroke-width="2"/>
  <line x1="800" y1="650" x2="790" y2="650" stroke="#10ac84" stroke-width="2"/>
  
  <!-- Wiring Lines -->
  
  <!-- Power Supply to ESP32 5V -->
  <path d="M 50 560 L 100 560 L 100 400 L 600 400" stroke="#ff6b6b" stroke-width="3" fill="none"/>
  
  <!-- Power Supply to ESP32 GND -->
  <path d="M 50 600 L 80 600 L 80 250 L 350 250" stroke="#333333" stroke-width="3" fill="none"/>
  
  <!-- GND Rails (Common) -->
  <line x1="350" y1="250" x2="600" y2="220" stroke="#333333" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="350" y1="250" x2="700" y2="270" stroke="#333333" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- VCC 3.3V Rails -->
  <line x1="350" y1="220" x2="700" y2="230" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="350" y1="220" x2="700" y2="600" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- W5500 SPI Connections -->
  
  <!-- MOSI -->
  <path d="M 600 280 L 650 280 L 650 310 L 700 310" stroke="#fcbad3" stroke-width="2"/>
  
  <!-- RESET -->
  <path d="M 350 280 L 300 280 L 300 350 L 700 350" stroke="#feca57" stroke-width="2"/>
  
  <!-- CS -->
  <path d="M 350 310 L 280 310 L 280 390 L 700 390" stroke="#4ecdc4" stroke-width="2"/>
  
  <!-- MISO -->
  <path d="M 350 340 L 260 340 L 260 430 L 700 430" stroke="#95e1d3" stroke-width="2"/>
  
  <!-- SCLK -->
  <path d="M 350 370 L 240 370 L 240 470 L 700 470" stroke="#f38181" stroke-width="2"/>
  
  <!-- INT (Optional) -->
  <path d="M 600 340 L 650 340 L 650 480 L 700 480" stroke="#aa96da" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- DHT22 DATA -->
  <path d="M 350 430 L 700 630" stroke="#48dbfb" stroke-width="2"/>
  
  <!-- Legend -->
  <rect x="50" y="650" width="900" height="80" fill="#2d2d44" stroke="#4a9eff" stroke-width="2" rx="5"/>
  <text x="500" y="675" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">
    راهنما - منابع معتبر
  </text>
  
  <!-- Legend Items -->
  <circle cx="80" cy="700" r="6" fill="#ff6b6b"/>
  <text x="95" y="705" fill="#ffffff" font-size="11">VCC</text>
  
  <circle cx="160" cy="700" r="6" fill="#333333"/>
  <text x="175" y="705" fill="#ffffff" font-size="11">GND</text>
  
  <circle cx="240" cy="700" r="6" fill="#f38181"/>
  <text x="255" y="705" fill="#ffffff" font-size="11">SCLK</text>
  
  <circle cx="330" cy="700" r="6" fill="#95e1d3"/>
  <text x="345" y="705" fill="#ffffff" font-size="11">MISO</text>
  
  <circle cx="420" cy="700" r="6" fill="#fcbad3"/>
  <text x="435" y="705" fill="#ffffff" font-size="11">MOSI</text>
  
  <circle cx="510" cy="700" r="6" fill="#4ecdc4"/>
  <text x="525" y="705" fill="#ffffff" font-size="11">CS</text>
  
  <circle cx="580" cy="700" r="6" fill="#feca57"/>
  <text x="595" y="705" fill="#ffffff" font-size="11">RESET</text>
  
  <circle cx="680" cy="700" r="6" fill="#48dbfb"/>
  <text x="695" y="705" fill="#ffffff" font-size="11">DATA</text>
  
  <!-- Notes -->
  <text x="100" y="720" fill="#888888" font-size="9">
    منابع: GitHub esp32-w5500-driver | Adafruit DHT Guide | Espressif ESP32-DevKitC V4
  </text>
  
  <!-- Warning Box -->
  <rect x="650" y="680" width="100" height="35" fill="#ff6b6b" fill-opacity="0.2" stroke="#ff6b6b" stroke-width="2" rx="5"/>
  <text x="700" y="700" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">
    ⚠️ USB و منبع
  </text>
  <text x="700" y="710" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">
    همزمان ممنوع
  </text>
  
</svg>