name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Install dependencies
        run: |
          uv sync
      
      - name: Build Windows executable
        if: matrix.os == 'windows-latest'
        run: |
          uv run flet pack src/main.py --name "RosetashHealthMonitoring" --product-name "پایش سلامت کارکنان" --company-name "Motosel — Roztash" --product-version "${{ github.ref_name }}" --onedir
          Compress-Archive -Path dist/RosetashHealthMonitoring -DestinationPath dist/RosetashHealthMonitoring-windows.zip
      
      - name: Build Linux executable
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run flet pack src/main.py --name "RosetashHealthMonitoring" --product-name "پایش سلامت کارکنان" --company-name "Motosel — Roztash" --product-version "${{ github.ref_name }}"
          cd dist && tar -czf RosetashHealthMonitoring-linux.tar.gz RosetashHealthMonitoring
      
      - name: Build macOS app
        if: matrix.os == 'macos-latest'
        run: |
          uv run flet pack src/main.py --name "RosetashHealthMonitoring" --product-name "پایش سلامت کارکنان" --company-name "Motosel — Roztash" --product-version "${{ github.ref_name }}"
          cd dist && zip -r RosetashHealthMonitoring-macos.zip RosetashHealthMonitoring.app
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            dist/*.zip
            dist/*.tar.gz
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          body: |
            ## نسخه ${{ github.ref_name }}
            
            خروجی‌های جدید:
            - `RosetashHealthMonitoring-windows.zip` — ویندوز
            - `RosetashHealthMonitoring-linux.tar.gz` — لینوکس
            - `RosetashHealthMonitoring-macos.zip` — مک
