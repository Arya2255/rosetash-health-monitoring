name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          pip install flet pyinstaller
          uv sync

      - name: Build Windows app
        run: |
          pyinstaller src/main.py `
            --name "RosetashHealthMonitoring" `
            --windowed `
            --onefile `
            --hidden-import=flet `
            --hidden-import=flet.cli `
            --hidden-import=flet.app `
            --hidden-import=flet.pip `
            --hidden-import=flet.version `
            --hidden-import=flet.messaging `
            --hidden-import=flet.embed `
            --hidden-import=flet.reconnecting_websocket `
            --hidden-import=flet.utils `
            --hidden-import=flet.event `
            --hidden-import=flet.transport `
            --hidden-import=flet.errors `
            --hidden-import=flet.env `
            --hidden-import=flet.constants `
            --hidden-import=flet_core `
            --hidden-import=flet_desktop `
            --collect-all flet `
            --collect-all flet_core `
            --collect-all flet_desktop `
            --copy-metadata flet `
            --copy-metadata flet_core `
            --copy-metadata flet_desktop `
            --distpath ./dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roztash-windows
          path: ./dist/*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*.exe
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
