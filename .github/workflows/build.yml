name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          pip install flet
          uv sync

      - name: Build Windows app
        run: |
          cd src
          flet pack main.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roztash-windows
          path: src/dist/*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/dist/*.exe
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
