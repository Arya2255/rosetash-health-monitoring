name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          uv sync
          uv pip install flet

      - name: Build Windows executable
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          chcp 65001
          # Install flet-cli to the project venv, then run flet build
          .\.venv\Scripts\Activate.ps1
          pip install flet-cli
          flet build windows -o ./dist --yes

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roztash-windows
          path: ./dist/
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: ./dist/*.exe
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}